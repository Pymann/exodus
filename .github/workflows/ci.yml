name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Ubuntu 24.04, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # pyproject: requires-python = ">=3.12"

      # A wheel, not an editable install.  This is the only step that can catch
      # a subpackage or a template missing from the package data -- the thing
      # that broke the installed exodus before (see "Package all subpackages and
      # the templates").
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      # Imported from somewhere other than the repository root, so the repo's
      # own exodus/ directory cannot stand in for the installed package.
      - name: The installed package is complete
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib, pathlib, exodus
          print("installed at", pathlib.Path(exodus.__file__).parent)
          for m in (
              "exodus.main",
              "exodus.core.cli",
              "exodus.models.project",
              "exodus.tools.build.build",
              "exodus.tools.pkg.package_manager",
          ):
              importlib.import_module(m)
              print("ok", m)
          PY
          exodus --help > /dev/null
          echo "console script ok"

      # The unit tests run against the repository copy, which is what they are
      # written for; the step above is what proves the wheel.
      - name: Unit tests
        run: |
          pip install pytest
          pytest -q

      # Real bugs only (F = pyflakes).  An undefined name is a NameError waiting
      # for its first caller, and it hides indefinitely behind an
      # `except Exception: pass` -- a missing `import json` once went unnoticed
      # that way, so a state file was never written and nobody saw it.  Kept
      # separate from the formatting gate below, so a failure here always means
      # a bug, never a blank line.
      - name: No undefined names
        run: |
          pip install flake8
          flake8 --select=F --count exodus/

      - name: Formatting
        run: |
          pip install black
          black --check .

      # pyproject carries the [tool.mypy] settings, so this is the same check
      # everywhere.  It was advisory for exactly one commit: 11 errors stood in
      # the way, all of them real -- a Language that was None whenever
      # tree-sitter was missing while the signature promised otherwise, four
      # places that overwrote an opened image with its own converted copy, and
      # pixel accessors used without checking what they returned.
      - name: Types
        run: |
          pip install mypy
          mypy exodus/

      # The wheel that passed the gates above goes into Kontor's generic store, so
      # other projects' CI (oculus) install this exact build instead of pip
      # building from git: generic/exodus/<commit>/exodus.whl, and generic/exodus/
      # latest/ for main.  A fixed file name, because the version in pyproject
      # stays the same across commits; the consumer renames it from the dist-info.
      #
      # Best effort: a missing secret or a reader-only token must not fail a
      # build that is otherwise green.
      - name: Put the wheel into kontor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          KONTOR_URL: ${{ secrets.KONTOR_URL || secrets.AIML_KONTOR_URL }}
          KONTOR_TOKEN: ${{ secrets.KONTOR_TOKEN || secrets.AIML_KONTOR_TOKEN }}
          KONTOR_CA: ${{ secrets.KONTOR_CA || secrets.AIML_KONTOR_CA }}
        run: |
          set -eu
          if [ -z "${KONTOR_URL:-}" ] || [ -z "${KONTOR_TOKEN:-}" ] || [ -z "${KONTOR_CA:-}" ]; then
            echo "KONTOR_* secrets missing -- nothing stored."
            exit 0
          fi
          work="$(mktemp -d)"
          printf '%s\n' "$KONTOR_CA" > "$work/ca.crt"
          pip wheel -q --no-deps -w "$work/dist" .
          whl=$(ls "$work"/dist/exodus-*.whl)
          summe=$(sha256sum "$whl" | cut -d' ' -f1)
          for key in "$GITHUB_SHA" latest; do
            ziel="${KONTOR_URL%/}/generic/exodus/${key}/exodus.whl"
            # No `curl -k`: without certificate checking a man in the middle could
            # take the write token.
            curl --silent --show-error --fail-with-body --max-time 300 \
                 --cacert "$work/ca.crt" \
                 -H "Authorization: Bearer $KONTOR_TOKEN" \
                 -H "X-Checksum-Sha256: $summe" \
                 -X PUT -T "$whl" "$ziel"
            echo "stored: generic/exodus/${key}/exodus.whl ($(basename "$whl"))"
          done
          rm -rf "$work"
